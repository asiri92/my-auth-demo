name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'client/**'
  workflow_dispatch:
jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Generate environment.ts
        run: |
          cat > client/src/environments/environment.ts << EOF
          export const environment = {
            production: true,
            msalConfig: {
              clientId: '${{ secrets.SPA_CLIENT_ID }}',
              authority: 'https://login.microsoftonline.com/${{ secrets.TENANT_ID }}',
              redirectUri: 'https://proud-ocean-0a628be1e.7.azurestaticapps.net',
              postLogoutRedirectUri: 'https://proud-ocean-0a628be1e.7.azurestaticapps.net'
            },
            apiConfig: {
              endpoint: '${{ secrets.API_ENDPOINT }}',
              scope: 'api://${{ secrets.API_CLIENT_ID }}/access_as_user'
            }
          };
          EOF
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_OCEAN_0A628BE1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./client" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist/my-auth-spa/browser" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_OCEAN_0A628BE1E }}
          action: "close"
